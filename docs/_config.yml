remote_theme: i-am-fran/web-docs-template
plugins:
  - jekyll-remote-theme

collections:
  docs:
    output: false

title: "Markdown-do"
tagline: "Manage the TODO.md in your project from the terminal. Tasks stay plain markdown checkboxes, in a file you commit with your code."
description: "Markdown-do (mdd) is a small CLI for TODO.md files: add, list, find and complete plain markdown checkboxes from the terminal, in one project or all of them."
github_url: "https://github.com/i-am-fran/markdown-do"
author_url: "https://iamfran.com"
author_label: "iamfran.com"
repository: "i-am-fran/markdown-do"
url: "https://i-am-fran.github.io"
baseurl: "/markdown-do"
logo: "/assets/mdd-small.png"

# GitHub Pages turns on the Primer theme by default, whose style.scss can
# overwrite the template's assets/css/style.css. Turn it off.
theme: null

markdown: kramdown
kramdown:
  auto_ids: true

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
