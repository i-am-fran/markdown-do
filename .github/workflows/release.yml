name: Release

# Fires whenever a human publishes a release (gh release create <tag> --notes "...").
# Tags in this repo are bare semver (no "v" prefix, e.g. "3.2.1").
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - run: make build-all

      - name: Generate checksums
        working-directory: build
        run: sha256sum mdd-* > checksums.txt

      # Signs checksums.txt with the release-signing key so `mdd update`
      # can verify authenticity, not just transport integrity (a plain
      # sha256 alone only protects against corruption — see
      # internal/cli/update_verify.go). MDD_RELEASE_SIGNING_KEY is a
      # hex-encoded ed25519 private-key seed stored as a repo secret; its
      # public half is embedded in internal/cli/update_verify.go.
      - name: Sign checksums.txt
        env:
          MDD_RELEASE_SIGNING_KEY: ${{ secrets.MDD_RELEASE_SIGNING_KEY }}
        run: go run ./cmd/mdd __sign-checksums build/checksums.txt > build/checksums.txt.sig

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            ./build/mdd-* ./build/checksums.txt ./build/checksums.txt.sig \
            --clobber --repo "${{ github.repository }}"
